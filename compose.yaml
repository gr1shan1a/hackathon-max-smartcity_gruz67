services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartcity
      POSTGRES_USER: smartcity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartcity-local-demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcity -d smartcity"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 3001
      NODE_ENV: production
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MINI_APP_URL: ${MINI_APP_URL:-}
      MAX_BOT_ENABLED: ${MAX_BOT_ENABLED:-false}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-se14409794_bot}
      MAX_API_BASE: ${MAX_API_BASE:-https://platform-api2.max.ru}
      DEMO_MODE: ${DEMO_MODE:-true}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DATABASE_URL: postgresql://smartcity:${POSTGRES_PASSWORD:-smartcity-local-demo}@db:5432/smartcity
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
